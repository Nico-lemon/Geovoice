<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Outer glowing radar rings -->
  <circle cx="256" cy="256" r="210" stroke="#10b981" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="12 12" fill="none" />
  <circle cx="256" cy="256" r="160" stroke="#10b981" stroke-width="4" stroke-opacity="0.35" fill="none" />
  
  <!-- GPS Pin Shape -->
  <g filter="url(#shadow)">
    <path d="M256 96 C185 96 128 153 128 224 C128 316 236 408 250 420 C253 423 259 423 262 420 C276 408 384 316 384 224 C384 153 327 96 256 96 Z" fill="url(#pin-grad)"/>
  </g>
  
  <!-- Inner Circle in Pin -->
  <circle cx="256" cy="216" r="54" fill="#020617" />
  
  <!-- Microphone & Sound Waves in center -->
  <!-- Microphone body -->
  <rect x="246" y="188" width="20" height="38" rx="10" fill="#34d399" />
  <!-- Microphone capsule arc -->
  <path d="M236 208 C236 226 276 226 276 208" stroke="#34d399" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Microphone stand -->
  <line x1="256" y1="228" x2="256" y2="242" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
  <line x1="244" y1="242" x2="268" y2="242" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
  
  <!-- Sound Wave Pulses -->
  <path d="M300 200 C306 208 306 224 300 232" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M212 200 C206 208 206 224 212 232" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
